# ============================================================
# 软考刷题系统 - 网关域名分流配置 (Gateway Routing)
# ============================================================

resolver 127.0.0.11 valid=10s ipv6=off;

# 1. 移动端 H5 刷题前台 (quiz.wothat.com)
server {
    listen 80;
    server_name quiz.wothat.com;

    location / {
        set $h5_upstream "http://h5:80";
        proxy_pass $h5_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 2. Web 管理后台系统 (admin.wothat.com - 免端口直接访问)
server {
    listen 80;
    server_name admin.wothat.com;

    location / {
        set $admin_upstream "http://admin:81";
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. 默认 IP / 其他域名回退 (Port 80 -> H5)
server {
    listen 80 default_server;
    server_name _;

    location / {
        set $h5_upstream "http://h5:80";
        proxy_pass $h5_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 4. 后台兼容端口 (Port 81 -> Admin)
server {
    listen 81 default_server;
    server_name _;

    location / {
        set $admin_upstream "http://admin:81";
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
