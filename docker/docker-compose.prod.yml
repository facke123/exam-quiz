# 软考刷题系统 - 生产环境 Docker Compose
# 说明: MySQL/Redis/RabbitMQ/MinIO 使用云服务(如腾讯云CDB/COS等), 本地仅部署应用层
# 启动: docker-compose -f docker-compose.prod.yml up -d
# 更新: docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d

version: "3.8"

services:
  # ========== NestJS 后端 ==========
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: exam-quiz/backend:latest
    container_name: exam-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Shanghai
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: exam-nginx
    restart: always
    ports:
      - "80:80"
      - "81:81"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/h5.conf:/etc/nginx/conf.d/h5.conf:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/admin.conf:ro
      - h5-static:/usr/share/nginx/html/h5:ro
      - admin-static:/usr/share/nginx/html/admin:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - exam-network

volumes:
  h5-static:
    external: true
    name: exam-h5-static
  admin-static:
    external: true
    name: exam-admin-static
  nginx-logs:

networks:
  exam-network:
    name: exam-network
    driver: bridge
