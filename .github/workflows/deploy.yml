# ============================================================
# 软考刷题系统 - 持续部署 (CD)
# 触发: push 到 main 分支
# 流程: 构建 Docker 镜像 -> 推送到镜像仓库 -> SSH 部署到服务器
# ============================================================
name: Deploy

on:
  push:
    branches: [main]

  # 支持手动触发
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  NAMESPACE: ${{ secrets.DOCKER_NAMESPACE || 'exam-quiz' }}

jobs:
  # -------------------- 构建并推送镜像 --------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: sha
        run: echo "SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/backend:${{ steps.sha.outputs.SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push H5
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.h5
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/h5:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/h5:${{ steps.sha.outputs.SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.admin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/admin:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/admin:${{ steps.sha.outputs.SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------- 部署到服务器 --------------------
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment files
        run: |
          cp docker/docker-compose.prod.yml docker-compose.server.yml
          # 用云镜像覆盖 build
          sed -i 's|build:.*|image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/backend:latest|' docker-compose.server.yml 2>/dev/null || true
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
          NAMESPACE: ${{ secrets.DOCKER_NAMESPACE || 'exam-quiz' }}

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.server.yml,docker/nginx/"
          target: ${{ secrets.DEPLOY_PATH || '/opt/exam-quiz' }}
          strip_components: 0

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/exam-quiz' }}
            echo ">>> 登录镜像仓库"
            docker login ${{ secrets.DOCKER_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }} -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            echo ">>> 拉取最新镜像"
            docker-compose -f docker-compose.server.yml pull
            echo ">>> 滚动重启服务"
            docker-compose -f docker-compose.server.yml up -d --remove-orphans
            echo ">>> 清理旧镜像"
            docker image prune -f
            echo ">>> 部署完成"
            docker-compose -f docker-compose.server.yml ps
