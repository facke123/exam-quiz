# ============================================================
# 软考刷题系统 - 持续部署 (CD) 到 Google Cloud 线上环境
# 触发: push 到 main 分支 或 手动触发
# 流程: SSH 登录 Google Cloud VM -> git pull -> docker compose up --build
# ============================================================
name: Deploy to Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: 检查必要 Secrets 配置
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ [配置错误] 缺少必要的 SSH 部署 Secrets！"
            echo "请前往 GitHub 仓库配置以下 Secrets (路径: Settings -> Secrets and variables -> Actions):"
            echo "  - SSH_HOST: Google Cloud 虚拟机的外部公网 IP"
            echo "  - SSH_USER: SSH 登录用户名（如 root、ubuntu 或您的 GCP 用户名）"
            echo "  - SSH_PRIVATE_KEY: 对应的 SSH 私钥全文 (包含 -----BEGIN ... -----)"
            echo "  - SSH_PORT (可选): SSH 端口，默认为 22"
            exit 1
          fi

      - name: SSH 登录 Google Cloud VM 并自动更新服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "=========================================="
            echo "🚀 正在更新 Google Cloud 线上应用版本..."
            echo "=========================================="
            
            # 1. 查找项目根目录
            TARGET_DIR="/opt/app/exam-quiz"
            if [ ! -d "$TARGET_DIR" ] && [ -d "/opt/exam-quiz" ]; then
              TARGET_DIR="/opt/exam-quiz"
            fi
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo ">>> 项目目录不存在，正在克隆仓库..."
              mkdir -p /opt/app
              git clone https://github.com/facke123/exam-quiz.git /opt/app/exam-quiz
              TARGET_DIR="/opt/app/exam-quiz"
            fi
            
            cd "$TARGET_DIR"
            echo ">>> 工作目录: $TARGET_DIR"
            
            # 2. 拉取最新代码
            echo ">>> 同步最新 main 分支代码..."
            git fetch --all
            git reset --hard origin/main
            
            # 3. 执行 Docker 容器热更新
            cd "$TARGET_DIR/docker"
            echo ">>> 重新构建并启动服务容器..."
            if [ -f "docker-compose.gcp.yml" ]; then
              docker compose -f docker-compose.gcp.yml up -d --build
            elif [ -f "docker-compose.prod.yml" ]; then
              docker compose -f docker-compose.prod.yml up -d --build
            else
              docker compose up -d --build
            fi
            
            # 4. 清理旧构建缓存与无用悬空镜像
            echo ">>> 清理悬空镜像..."
            docker image prune -f
            
            echo "=========================================="
            echo "🎉 Google Cloud 线上版本发布成功！"
            echo "📱 前台: https://quiz.wothat.com"
            echo "🖥️ 后台: https://admin.wothat.com"
            echo "=========================================="
